<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>SOG-Forkeur - Gestion des boutiques</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .neu-card {
      background: #1e293b;
      border-radius: 1.5rem;
      box-shadow: inset 2px 2px 4px rgba(255,255,255,0.05),
                  inset -2px -2px 4px rgba(0,0,0,0.8),
                  6px 6px 12px rgba(0,0,0,0.6);
    }
    .neu-button {
      background: #1e293b;
      color: white;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      box-shadow: inset 2px 2px 4px rgba(255,255,255,0.1),
                  inset -2px -2px 4px rgba(0,0,0,0.9),
                  4px 4px 8px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      font-weight: 500;
    }
    .neu-button:hover {
      box-shadow: inset -2px -2px 4px rgba(255,255,255,0.05),
                  inset 2px 2px 4px rgba(0,0,0,0.9);
      transform: scale(0.98);
    }
    .neu-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .neu-input {
      background: #1e293b;
      color: white;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.8),
                  inset -2px -2px 4px rgba(255,255,255,0.05);
      border: none;
      outline: none;
      width: 100%;
      transition: box-shadow 0.2s;
    }
    .neu-input:focus {
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.9),
                  inset -2px -2px 4px rgba(255,255,255,0.1),
                  0 0 0 2px #3b82f6;
    }
    .neu-input::placeholder {
      color: #94a3b8;
    }
    .log-area {
      background: #0f172a;
      border-radius: 0.75rem;
      padding: 1rem;
      max-height: 400px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      color: #94a3b8;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-area .success { color: #34d399; }
    .log-area .error { color: #f87171; }
    .log-area .info { color: #60a5fa; }
    .log-area .warning { color: #fbbf24; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
    .spinner {
      border: 3px solid #1e293b;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tab-button {
      background: rgba(30,41,59,0.5);
      color: #94a3b8;
      border: none;
      padding: 0.5rem 1.5rem;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-button.active {
      background: rgba(59,130,246,0.3);
      color: #f1f5f9;
      box-shadow: 0 4px 16px rgba(59,130,246,0.15);
    }
    .tab-button:hover:not(.active) {
      background: rgba(30,41,59,0.8);
      color: #f1f5f9;
    }
  </style>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4b6cb7" />
  <link rel="apple-touch-icon" href="icon.png" />
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  function App() {
    // ---- FIREBASE INIT ----
    var firebaseConfig = {
      apiKey: "AIzaSyCegKjHSw2DzF1zcBVdG6iZyGK2P3ig1rM",
      authDomain: "sog-hanout.firebaseapp.com",
      projectId: "sog-hanout",
      storageBucket: "sog-hanout.firebasestorage.app",
      messagingSenderId: "108437302312",
      appId: "1:108437302312:web:9faa1f7084e5797cf9591d",
      measurementId: "G-V1VFE9YDE3",
      databaseURL: "https://sog-hanout-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();
    var db = firebase.database();

    // ---- ÉTATS ----
    const [token, setToken] = useState(null);
    const [isProcessing, setIsProcessing] = useState(false);
    const [logs, setLogs] = useState([]);
    const [shops, setShops] = useState([]);
    const [vendor, setVendor] = useState('');
    const [vendorEmail, setVendorEmail] = useState('');
    const [vendorPassword, setVendorPassword] = useState('');
    const [isLoading, setIsLoading] = useState(true);
    const logRef = useRef(null);
    
    // États Firebase Auth
    const [firebaseUser, setFirebaseUser] = useState(null);
    const [isFirebaseAdmin, setIsFirebaseAdmin] = useState(false);
    const [activeTab, setActiveTab] = useState('forkeur');
    
    // États gestion admins
    const [admins, setAdmins] = useState([]);
    const [newAdminEmail, setNewAdminEmail] = useState('');
    const [isAddingAdmin, setIsAddingAdmin] = useState(false);
    
    // États gestion vendeurs
    const [vendors, setVendors] = useState([]);
    const [newVendorEmail, setNewVendorEmail] = useState('');
    const [newVendorName, setNewVendorName] = useState('');
    const [isAddingVendor, setIsAddingVendor] = useState(false);

    // État pour stocker les identifiants admin (pour reconnexion)
    const [adminCredentials, setAdminCredentials] = useState(null);

    // ---- CONSTANTES ----
    const TEMPLATE_OWNER = 'mekeirish';
    const TEMPLATE_REPO = 'hanout-template';

    // ---- INIT ----
    useEffect(() => {
      const storedToken = localStorage.getItem('forkeur_token');
      if (storedToken) {
        setToken(storedToken);
        loadShops(storedToken);
      }
      setIsLoading(false);
    }, []);

    // ---- AUTH FIREBASE (pour l'admin du Forkeur) ----
    useEffect(() => {
      var unsubscribe = auth.onAuthStateChanged(async function(user) {
        if (user) {
          setFirebaseUser(user);
          // Stocker l'email de l'admin pour reconnexion automatique (sans mot de passe, on le demande)
          db.ref('admins').once('value').then(function(snapshot) {
            var adminList = snapshot.val() || [];
            if (Array.isArray(adminList) && adminList.includes(user.uid)) {
              setIsFirebaseAdmin(true);
              loadAdmins();
              loadVendors();
              addLog(`✅ Authentifié en tant qu'admin Firebase (${user.email})`, 'success');
            } else {
              setIsFirebaseAdmin(false);
              addLog(`ℹ️ Connecté en tant que ${user.email} (pas admin)`, 'info');
            }
          }).catch(function(err) {
            addLog(`❌ Erreur vérification admin: ${err.message}`, 'error');
          });
        } else {
          setFirebaseUser(null);
          setIsFirebaseAdmin(false);
        }
      });
      return function() { unsubscribe(); };
    }, []);

    // ---- SCROLL AUTO DES LOGS ----
    useEffect(() => {
      if (logRef.current) {
        logRef.current.scrollTop = logRef.current.scrollHeight;
      }
    }, [logs]);

    // ---- GESTION DU TOKEN ----
    const handleTokenChange = (e) => {
      const newToken = e.target.value;
      setToken(newToken);
      if (newToken) {
        localStorage.setItem('forkeur_token', newToken);
        loadShops(newToken);
      }
    };

    // ---- CHARGEMENT DES BOUTIQUES ----
    const loadShops = async (tokenValue) => {
      try {
        const res = await fetch('https://api.github.com/user/repos?per_page=100', {
          headers: { Authorization: `token ${tokenValue}` }
        });
        if (res.ok) {
          const repos = await res.json();
          const shopRepos = repos.filter(repo => 
            repo.name.startsWith('hanout-') && repo.name !== 'hanout-template'
          );
          setShops(shopRepos);
          addLog(`🔍 ${shopRepos.length} boutique(s) trouvée(s).`, 'info');
        } else {
          addLog(`❌ Erreur chargement des repos: ${res.status}`, 'error');
        }
      } catch (err) {
        addLog(`❌ Erreur: ${err.message}`, 'error');
      }
    };

    // ---- AJOUT DE LOG ----
    const addLog = (message, type = 'info') => {
      setLogs(prev => [...prev, { message, type, timestamp: new Date().toLocaleTimeString() }]);
    };

    // ---- AUTH FIREBASE (connexion/déconnexion) ----
    const handleFirebaseLogin = async (e) => {
      e.preventDefault();
      const form = e.target;
      const email = form.email.value;
      const password = form.password.value;
      setIsProcessing(true);
      try {
        await auth.signInWithEmailAndPassword(email, password);
        addLog(`✅ Connecté à Firebase`, 'success');
        setAdminCredentials({ email, password }); // Stocker pour reconnexion auto
      } catch (error) {
        addLog(`❌ Erreur connexion Firebase: ${error.message}`, 'error');
      }
      setIsProcessing(false);
    };

    const handleFirebaseLogout = () => {
      auth.signOut();
      setAdminCredentials(null);
      addLog(`🔓 Déconnecté de Firebase`, 'info');
    };

    // ---- GESTION DES ADMINS ----
    const loadAdmins = function() {
      db.ref('admins').on('value', function(snapshot) {
        var data = snapshot.val() || [];
        if (Array.isArray(data)) {
          var adminList = data.map(function(uid) {
            return { uid: uid, email: 'Chargement...' };
          });
          setAdmins(adminList);
          adminList.forEach(function(admin, index) {
            if (admin.uid) {
              db.ref('users/' + admin.uid + '/email').once('value').then(function(snap) {
                var email = snap.val();
                if (email) {
                  setAdmins(prev => {
                    var newList = [...prev];
                    newList[index].email = email;
                    return newList;
                  });
                }
              });
            }
          });
        } else {
          setAdmins([]);
        }
      });
    };

    const addAdmin = async function() {
      if (!newAdminEmail.trim()) {
        addLog('❌ Veuillez entrer un email', 'error');
        return;
      }
      setIsAddingAdmin(true);
      try {
        var usersRef = db.ref('users');
        var snapshot = await usersRef.once('value');
        var users = snapshot.val() || {};
        var foundUid = null;
        for (var uid in users) {
          if (users[uid].email === newAdminEmail.trim()) {
            foundUid = uid;
            break;
          }
        }
        if (!foundUid) {
          addLog(`❌ Email ${newAdminEmail} non trouvé. L'utilisateur doit d'abord se connecter à SOG.`, 'error');
          setIsAddingAdmin(false);
          return;
        }
        var adminsRef = db.ref('admins');
        var currentAdmins = await adminsRef.once('value');
        var adminList = currentAdmins.val() || [];
        if (!adminList.includes(foundUid)) {
          adminList.push(foundUid);
          await adminsRef.set(adminList);
          addLog(`✅ ${newAdminEmail} est maintenant admin`, 'success');
          setNewAdminEmail('');
        } else {
          addLog(`ℹ️ ${newAdminEmail} est déjà admin`, 'info');
        }
      } catch (error) {
        addLog(`❌ Erreur: ${error.message}`, 'error');
      }
      setIsAddingAdmin(false);
    };

    const removeAdmin = async function(uid) {
      if (!confirm('Retirer cet admin ?')) return;
      try {
        var adminsRef = db.ref('admins');
        var snapshot = await adminsRef.once('value');
        var adminList = snapshot.val() || [];
        adminList = adminList.filter(id => id !== uid);
        await adminsRef.set(adminList);
        addLog(`✅ Admin retiré`, 'success');
      } catch (error) {
        addLog(`❌ Erreur: ${error.message}`, 'error');
      }
    };

    // ---- GESTION DES VENDEURS ----
    const loadVendors = function() {
      db.ref('vendors').on('value', function(snapshot) {
        var data = snapshot.val();
        if (data) {
          var vendorList = Object.keys(data).map(function(key) {
            return { name: key, ...data[key] };
          });
          setVendors(vendorList);
        } else {
          setVendors([]);
        }
      });
    };

    const addVendor = async function() {
      if (!newVendorName.trim() || !newVendorEmail.trim()) {
        addLog('❌ Veuillez remplir tous les champs', 'error');
        return;
      }
      setIsAddingVendor(true);
      try {
        var usersRef = db.ref('users');
        var snapshot = await usersRef.once('value');
        var users = snapshot.val() || {};
        var foundUid = null;
        for (var uid in users) {
          if (users[uid].email === newVendorEmail.trim()) {
            foundUid = uid;
            break;
          }
        }
        if (!foundUid) {
          addLog(`❌ Email ${newVendorEmail} non trouvé. L'utilisateur doit d'abord se connecter à SOG.`, 'error');
          setIsAddingVendor(false);
          return;
        }
        var vendorRef = db.ref('vendors/' + newVendorName.trim().toLowerCase());
        await vendorRef.set({
          uid: foundUid,
          name: newVendorName.trim(),
          email: newVendorEmail.trim(),
          createdAt: new Date().toISOString()
        });
        addLog(`✅ ${newVendorName} est maintenant vendeur`, 'success');
        setNewVendorName('');
        setNewVendorEmail('');
      } catch (error) {
        addLog(`❌ Erreur: ${error.message}`, 'error');
      }
      setIsAddingVendor(false);
    };

    const removeVendor = async function(vendorName) {
      if (!confirm(`Supprimer le vendeur ${vendorName} ?`)) return;
      try {
        await db.ref('vendors/' + vendorName).remove();
        addLog(`✅ ${vendorName} retiré des vendeurs`, 'success');
      } catch (error) {
        addLog(`❌ Erreur: ${error.message}`, 'error');
      }
    };

    // ---- VÉRIFIER LES PERMISSIONS DU TOKEN ----
    const checkTokenPermissions = async () => {
      try {
        const res = await fetch('https://api.github.com/user', {
          headers: { Authorization: `token ${token}` }
        });
        if (!res.ok) throw new Error('Token invalide');
        const user = await res.json();
        addLog(`✅ Token valide pour ${user.login}`, 'success');
        const scopes = res.headers.get('X-OAuth-Scopes');
        if (scopes && !scopes.includes('repo') && !scopes.includes('public_repo')) {
          addLog('⚠️ Le token n\'a pas les permissions "repo" ou "public_repo".', 'warning');
        }
        return true;
      } catch (err) {
        addLog(`❌ Erreur vérification token: ${err.message}`, 'error');
        return false;
      }
    };

    // ---- VÉRIFIER SI LE REPO EXISTE DÉJÀ ----
    const checkRepoExists = async (repoName) => {
      try {
        const res = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${repoName}`,
          { headers: { Authorization: `token ${token}` } }
        );
        return res.status === 200;
      } catch (e) {
        return false;
      }
    };

    // ---- CRÉER LE REPO À PARTIR DU TEMPLATE ----
    const createRepoFromTemplate = async (repoName) => {
      const res = await fetch(`https://api.github.com/repos/${TEMPLATE_OWNER}/${TEMPLATE_REPO}/generate`, {
        method: 'POST',
        headers: {
          Authorization: `token ${token}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify({
          name: repoName,
          owner: TEMPLATE_OWNER,
          private: false,
          include_all_branches: false
        })
      });
      if (!res.ok) {
        const err = await res.json();
        if (err.message && err.message.includes('already exists')) {
          addLog(`⚠️ Le repo ${repoName} existe déjà`, 'warning');
          return null;
        }
        throw new Error(`Création échouée: ${err.message}`);
      }
      return await res.json();
    };

    // ---- ACTIVER GITHUB PAGES ----
    const enableGitHubPages = async (repoName) => {
      try {
        addLog(`🌐 Activation de GitHub Pages pour ${repoName}...`, 'info');
        const res = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${repoName}/pages`,
          {
            method: 'POST',
            headers: {
              Authorization: `token ${token}`,
              'Content-Type': 'application/json',
              'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify({
              source: { branch: 'main', path: '/' }
            })
          }
        );
        if (res.status === 201 || res.status === 200) {
          addLog(`✅ GitHub Pages activé pour ${repoName}`, 'success');
          return true;
        } else if (res.status === 409) {
          addLog(`ℹ️ GitHub Pages déjà activé pour ${repoName}`, 'info');
          return true;
        } else {
          const err = await res.json();
          addLog(`⚠️ Erreur activation Pages: ${err.message}`, 'warning');
          return false;
        }
      } catch (error) {
        addLog(`⚠️ Erreur activation Pages: ${error.message}`, 'warning');
        return false;
      }
    };

    // ---- ATTENDRE QUE GITHUB PAGES SOIT PRÊT ----
    const waitForPagesDeployment = async (repoName, maxAttempts = 20) => {
      let attempts = 0;
      const siteUrl = `https://${TEMPLATE_OWNER}.github.io/${repoName}/`;
      addLog(`⏳ Vérification du déploiement Pages pour ${repoName}...`, 'warning');
      while (attempts < maxAttempts) {
        try {
          const siteCheck = await fetch(siteUrl, { method: 'HEAD' });
          if (siteCheck.status === 200) {
            addLog(`✅ Site accessible : ${siteUrl}`, 'success');
            return true;
          }
          addLog(`⏳ Site pas encore accessible... (${attempts + 1}/${maxAttempts})`, 'warning');
          await new Promise(resolve => setTimeout(resolve, 3000));
          attempts++;
        } catch (err) {
          await new Promise(resolve => setTimeout(resolve, 3000));
          attempts++;
        }
      }
      addLog(`⚠️ Déploiement Pages non confirmé après ${maxAttempts} tentatives.`, 'warning');
      return false;
    };

    // ---- RÉCUPÉRER LE CONTENU D'UN FICHIER ----
    const getFileContent = async (repoName, filePath) => {
      try {
        const res = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${repoName}/contents/${filePath}`,
          { headers: { Authorization: `token ${token}` } }
        );
        if (!res.ok) throw new Error(`Erreur ${res.status}: ${await res.text()}`);
        return await res.json();
      } catch (err) {
        throw new Error(`Impossible de récupérer ${filePath}: ${err.message}`);
      }
    };

    // ---- METTRE À JOUR UN FICHIER ----
    const updateFile = async (repoName, filePath, content, message) => {
      try {
        let sha = null;
        try {
          const fileData = await getFileContent(repoName, filePath);
          sha = fileData.sha;
        } catch (e) {}
        const payload = {
          message: message,
          content: btoa(unescape(encodeURIComponent(content))),
          branch: 'main'
        };
        if (sha) payload.sha = sha;
        const res = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${repoName}/contents/${filePath}`,
          {
            method: 'PUT',
            headers: {
              Authorization: `token ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          }
        );
        if (!res.ok) {
          const err = await res.json();
          throw new Error(`Erreur ${res.status}: ${err.message}`);
        }
        return await res.json();
      } catch (err) {
        throw new Error(`Impossible de mettre à jour ${filePath}: ${err.message}`);
      }
    };

    // ---- MISE À JOUR DE SHOPS.JSON ----
    const updateShopsJson = async (vendorName) => {
      try {
        addLog(`📝 Mise à jour de shops.json pour ${vendorName}...`, 'info');
        const shopsUrl = 'https://api.github.com/repos/mekeirish/sog/contents/shops.json';
        let shops = [];
        let sha = null;
        try {
          const getRes = await fetch(shopsUrl, {
            headers: { Authorization: `token ${token}` }
          });
          if (getRes.ok) {
            const data = await getRes.json();
            sha = data.sha;
            const decoded = atob(data.content);
            shops = JSON.parse(decoded);
          }
        } catch (e) { /* ignore */ }
        const existing = shops.find(s => s.vendor === vendorName);
        if (existing) {
          addLog(`ℹ️ ${vendorName} déjà présent dans shops.json`, 'info');
          return true;
        }
        shops.push({
          vendor: vendorName,
          name: vendorName.charAt(0).toUpperCase() + vendorName.slice(1),
          url: `https://${TEMPLATE_OWNER}.github.io/hanout-${vendorName}/`
        });
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(shops, null, 2))));
        const payload = {
          message: `✨ Ajout automatique de ${vendorName}`,
          content: content,
          branch: 'main'
        };
        if (sha) payload.sha = sha;
        const putRes = await fetch(shopsUrl, {
          method: 'PUT',
          headers: {
            Authorization: `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        if (!putRes.ok) {
          const err = await putRes.json();
          throw new Error(`GitHub ${putRes.status}: ${err.message}`);
        }
        addLog(`✅ ${vendorName} ajouté dans shops.json`, 'success');
        return true;
      } catch (error) {
        addLog(`❌ Erreur mise à jour shops.json: ${error.message}`, 'error');
        return false;
      }
    };

    // ---- FONCTION : CRÉER LE COMPTE VENDEUR (ou récupérer UID existant) ----
    const createVendorAccount = async (email, password) => {
      try {
        // 1. Vérifier si l'email existe déjà dans /users
        const usersRef = db.ref('users');
        const snapshot = await usersRef.orderByChild('email').equalTo(email).once('value');
        const userData = snapshot.val();

        if (userData) {
          // L'utilisateur existe déjà
          const uid = Object.keys(userData)[0];
          addLog(`ℹ️ ${email} existe déjà (UID: ${uid})`, 'info');
          return uid;
        }

        // 2. L'email n'existe pas → on crée le compte Firebase Auth
        if (!firebaseUser) {
          throw new Error('Tu dois être connecté à Firebase pour créer un compte vendeur.');
        }

        // Sauvegarder les identifiants de l'admin avant de créer le nouveau compte
        // On les a stockés dans adminCredentials (email + password) lors de la connexion
        // Si on ne les a pas, on les demande
        let adminEmail = firebaseUser.email;
        let adminPassword = null;
        if (adminCredentials) {
          adminEmail = adminCredentials.email;
          adminPassword = adminCredentials.password;
        } else {
          // On demande le mot de passe de l'admin
          adminPassword = prompt(`Entrez votre mot de passe admin (${firebaseUser.email}) pour continuer :`);
          if (!adminPassword) throw new Error('Mot de passe admin requis.');
          setAdminCredentials({ email: adminEmail, password: adminPassword });
        }

        // Créer le compte vendeur
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const vendorUid = userCredential.user.uid;
        addLog(`✅ Compte Firebase créé pour ${email} (UID: ${vendorUid})`, 'success');

        // Ajouter l'utilisateur dans /users
        await db.ref('users/' + vendorUid).set({
          email: email,
          name: vendor.trim(),
          createdAt: new Date().toISOString()
        });
        addLog(`✅ Profil ajouté dans /users`, 'success');

        // Reconnecter l'admin après la création
        await auth.signInWithEmailAndPassword(adminEmail, adminPassword);
        addLog(`✅ Réauthentifié en tant qu'admin (${adminEmail})`, 'success');

        return vendorUid;

      } catch (error) {
        if (error.code === 'auth/email-already-in-use') {
          addLog(`⚠️ ${email} est déjà utilisé dans Firebase Auth. Recherche de l'UID...`, 'warning');
          // Essayer de récupérer l'UID depuis /users
          const snap = await db.ref('users').orderByChild('email').equalTo(email).once('value');
          const data = snap.val();
          if (data) {
            const uid = Object.keys(data)[0];
            addLog(`✅ UID existant trouvé : ${uid}`, 'info');
            return uid;
          } else {
            throw new Error('Email déjà utilisé, mais impossible de récupérer l\'UID.');
          }
        } else if (error.code === 'auth/weak-password') {
          throw new Error('Le mot de passe doit contenir au moins 6 caractères.');
        } else {
          throw error;
        }
      }
    };

    // ---- CRÉATION D'UNE BOUTIQUE (avec création automatique du compte vendeur) ----
    const createShop = async () => {
      if (!vendor.trim()) {
        addLog('❌ Veuillez entrer un nom de boutique', 'error');
        return;
      }
      if (!vendorEmail.trim() || !vendorPassword.trim()) {
        addLog('❌ Veuillez entrer l\'email ET le mot de passe du vendeur', 'error');
        return;
      }
      if (!token) {
        addLog('❌ Token GitHub requis', 'error');
        return;
      }

      setIsProcessing(true);
      const cleanVendor = vendor.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
      const repoName = `hanout-${cleanVendor}`;

      try {
        const hasPermissions = await checkTokenPermissions();
        if (!hasPermissions) {
          addLog('❌ Le token n\'a pas les permissions nécessaires', 'error');
          setIsProcessing(false);
          return;
        }

        const exists = await checkRepoExists(repoName);
        if (exists) {
          addLog(`⚠️ ${repoName} existe déjà !`, 'warning');
          setIsProcessing(false);
          return;
        }

        addLog(`🚀 Création de ${repoName}...`, 'info');
        const repoData = await createRepoFromTemplate(repoName);
        if (!repoData) {
          setIsProcessing(false);
          return;
        }
        addLog(`✅ Repo ${repoName} créé`, 'success');

        await new Promise(resolve => setTimeout(resolve, 3000));

        // ----- Mise à jour de index.html -----
        addLog(`📄 Récupération du template index.html...`, 'info');
        const templateData = await getFileContent(TEMPLATE_REPO, 'index.html');
        let templateContent = atob(templateData.content);
        let newContent = templateContent.replace(/{{VENDOR}}/g, cleanVendor);
        await updateFile(repoName, 'index.html', newContent, `Initialisation index.html`);
        addLog(`✅ index.html mis à jour`, 'success');

        // ----- Mise à jour de manifest.json -----
        addLog(`📄 Récupération du template manifest.json...`, 'info');
        const manifestData = await getFileContent(TEMPLATE_REPO, 'manifest.json');
        let manifestContent = atob(manifestData.content);
        manifestContent = manifestContent.replace(/{{VENDOR}}/g, cleanVendor);
        await updateFile(repoName, 'manifest.json', manifestContent, `Initialisation manifest.json`);
        addLog(`✅ manifest.json mis à jour`, 'success');

        // ----- Mise à jour de sw.js -----
        addLog(`📄 Récupération du template sw.js...`, 'info');
        const swData = await getFileContent(TEMPLATE_REPO, 'sw.js');
        let swContent = atob(swData.content);
        swContent = swContent.replace(/{{VENDOR}}/g, cleanVendor);
        await updateFile(repoName, 'sw.js', swContent, `Initialisation sw.js`);
        addLog(`✅ sw.js mis à jour`, 'success');

        // ----- Création de don.json -----
        addLog(`📦 Création de don.json...`, 'info');
        const defaultData = {
          settings: {
            title: `Boutique de ${cleanVendor}`,
            currency: 'DZD',
            showStock: true,
            ntfyTopic: `${cleanVendor}_commandes`
          },
          categories: [],
          products: []
        };
        await updateFile(
          repoName,
          'don.json',
          JSON.stringify(defaultData, null, 2),
          `Ajout du catalogue ${cleanVendor}`
        );
        addLog(`✅ don.json créé`, 'success');

        // ----- Activer GitHub Pages -----
        await enableGitHubPages(repoName);
        await waitForPagesDeployment(repoName);

        // ----- Mettre à jour shops.json -----
        await updateShopsJson(cleanVendor);

        // ----- CRÉATION DU COMPTE VENDEUR -----
        addLog(`🔐 Création du compte Firebase pour ${vendorEmail}...`, 'info');
        let vendorUid = null;
        try {
          vendorUid = await createVendorAccount(vendorEmail.trim(), vendorPassword.trim());
        } catch (error) {
          addLog(`❌ Erreur création compte: ${error.message}`, 'error');
          // On continue quand même pour que la boutique soit créée (sans vendeur)
          vendorUid = null;
        }

        // ----- ASSOCIATION DU VENDEUR -----
        if (vendorUid) {
          await db.ref('vendors/' + cleanVendor).set({
            uid: vendorUid,
            name: cleanVendor,
            email: vendorEmail.trim(),
            createdAt: new Date().toISOString()
          });
          addLog(`✅ ${cleanVendor} associé à ${vendorEmail}`, 'success');
          loadVendors();
        } else {
          addLog(`⚠️ ${cleanVendor} créé mais sans association vendeur.`, 'warning');
        }

        // ----- Rafraîchir la liste -----
        await loadShops(token);
        setVendor('');
        setVendorEmail('');
        setVendorPassword('');

        const pagesUrl = `https://${TEMPLATE_OWNER}.github.io/${repoName}/`;
        addLog(`🎉 Boutique ${repoName} créée !`, 'success');
        addLog(`🌐 ${pagesUrl}`, 'success');

        // Si le vendeur a été créé, on affiche un récapitulatif
        if (vendorUid) {
          addLog(`📧 Identifiants vendeur : ${vendorEmail} / ${vendorPassword}`, 'info');
        }

      } catch (error) {
        addLog(`❌ Erreur: ${error.message}`, 'error');
      }
      setIsProcessing(false);
    };

    // ---- MISE À JOUR INDIVIDUELLE ----
    const updateShop = async (repoName) => {
      if (!token) {
        addLog('❌ Token requis', 'error');
        return;
      }
      setIsProcessing(true);
      const vendorName = repoName.replace('hanout-', '');
      try {
        addLog(`🔄 Mise à jour de ${repoName}...`, 'info');

        // ----- Mise à jour index.html -----
        const templateRes = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${TEMPLATE_REPO}/contents/index.html`,
          { headers: { Authorization: `token ${token}` } }
        );
        if (!templateRes.ok) throw new Error('Impossible de récupérer le template');
        const templateData = await templateRes.json();
        let templateContent = atob(templateData.content);
        const shopRes = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${repoName}/contents/index.html`,
          { headers: { Authorization: `token ${token}` } }
        );
        if (!shopRes.ok) throw new Error(`Impossible de récupérer ${repoName}`);
        const shopData = await shopRes.json();
        const currentContent = atob(shopData.content);
        const vendorMatch = currentContent.match(/var VENDOR = "([^"]+)";/);
        const currentVendor = vendorMatch ? vendorMatch[1] : vendorName;

        let newContent = templateContent.replace(/{{VENDOR}}/g, currentVendor);
        await updateFile(repoName, 'index.html', newContent, `Mise à jour index.html`);
        addLog(`✅ index.html mis à jour`, 'success');

        // ----- Mise à jour manifest.json -----
        const manifestRes = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${TEMPLATE_REPO}/contents/manifest.json`,
          { headers: { Authorization: `token ${token}` } }
        );
        if (manifestRes.ok) {
          const manifestData = await manifestRes.json();
          let manifestContent = atob(manifestData.content);
          manifestContent = manifestContent.replace(/{{VENDOR}}/g, currentVendor);
          await updateFile(repoName, 'manifest.json', manifestContent, `Mise à jour manifest.json`);
          addLog(`✅ manifest.json mis à jour`, 'success');
        } else {
          addLog(`⚠️ manifest.json non trouvé dans le template, ignoré`, 'warning');
        }

        // ----- Mise à jour sw.js -----
        const swRes = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${TEMPLATE_REPO}/contents/sw.js`,
          { headers: { Authorization: `token ${token}` } }
        );
        if (swRes.ok) {
          const swData = await swRes.json();
          let swContent = atob(swData.content);
          swContent = swContent.replace(/{{VENDOR}}/g, currentVendor);
          await updateFile(repoName, 'sw.js', swContent, `Mise à jour sw.js`);
          addLog(`✅ sw.js mis à jour`, 'success');
        } else {
          addLog(`⚠️ sw.js non trouvé dans le template, ignoré`, 'warning');
        }

        // Mettre à jour shops.json
        await updateShopsJson(currentVendor);
        addLog(`✅ ${repoName} mis à jour.`, 'success');

      } catch (error) {
        addLog(`❌ Erreur ${repoName}: ${error.message}`, 'error');
      }
      setIsProcessing(false);
    };

    // ---- MISE À JOUR MASSIVE ----
    const updateAllShops = async () => {
      if (!token) {
        addLog('❌ Token requis', 'error');
        return;
      }
      setIsProcessing(true);
      try {
        const repos = await fetch('https://api.github.com/user/repos?per_page=100', {
          headers: { Authorization: `token ${token}` }
        });
        if (!repos.ok) throw new Error('Impossible de récupérer les repos');
        const repoList = await repos.json();
        const shopRepos = repoList.filter(repo => 
          repo.name.startsWith('hanout-') && repo.name !== 'hanout-template'
        );
        addLog(`📦 ${shopRepos.length} boutique(s) trouvée(s).`, 'info');
        let successCount = 0;
        for (const repo of shopRepos) {
          await updateShop(repo.name);
          successCount++;
        }
        addLog(`✅ ${successCount} boutique(s) mises à jour.`, 'success');
      } catch (error) {
        addLog(`❌ Erreur mise à jour massive: ${error.message}`, 'error');
      }
      setIsProcessing(false);
    };

    // ---- RENDU ----
    if (isLoading) {
      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-900">
          <div className="spinner"></div>
        </div>
      );
    }

    return (
      <div className="min-h-screen bg-slate-900 text-white p-4">

        <div className="max-w-6xl mx-auto">
          <h1 className="text-3xl font-bold text-white mb-6 text-center">🔧 SOG-Forkeur</h1>

          {/* ---- ONGLETS ---- */}
          <div className="flex gap-2 mb-6">
            <button 
              onClick={() => setActiveTab('forkeur')}
              className={'tab-button ' + (activeTab === 'forkeur' ? 'active' : '')}
            >
              🏪 Forkeur
            </button>
            <button 
              onClick={() => setActiveTab('admin')}
              className={'tab-button ' + (activeTab === 'admin' ? 'active' : '')}
            >
              👑 Administration Firebase
            </button>
          </div>

          {/* ---- ONGLET FORKEUR ---- */}
          {activeTab === 'forkeur' && (
            <div>
              {/* Token GitHub */}
              <div className="neu-card p-6 mb-6">
                <h2 className="text-xl font-semibold text-white mb-3">🔑 Token GitHub</h2>
                <input
                  type="password"
                  value={token || ''}
                  onChange={handleTokenChange}
                  placeholder="Entrez votre token GitHub (fine-grained)"
                  className="neu-input"
                />
                <p className="text-xs text-gray-400 mt-2">
                  Le token est stocké localement dans votre navigateur.
                </p>
              </div>

              {/* Créer une boutique (avec mot de passe vendeur) */}
              <div className="neu-card p-6 mb-6">
                <h2 className="text-xl font-semibold text-white mb-3">✨ Créer une boutique</h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label className="text-sm text-gray-400 block mb-1">Nom de la boutique</label>
                    <input
                      type="text"
                      value={vendor}
                      onChange={(e) => setVendor(e.target.value)}
                      placeholder="ex: milo"
                      className="neu-input"
                      disabled={isProcessing}
                    />
                  </div>
                  <div>
                    <label className="text-sm text-gray-400 block mb-1">Email du vendeur</label>
                    <input
                      type="email"
                      value={vendorEmail}
                      onChange={(e) => setVendorEmail(e.target.value)}
                      placeholder="vendeur@email.com"
                      className="neu-input"
                      disabled={isProcessing}
                    />
                  </div>
                  <div>
                    <label className="text-sm text-gray-400 block mb-1">Mot de passe du vendeur</label>
                    <input
                      type="password"
                      value={vendorPassword}
                      onChange={(e) => setVendorPassword(e.target.value)}
                      placeholder="Mot de passe (min 6 car.)"
                      className="neu-input"
                      disabled={isProcessing}
                    />
                  </div>
                </div>
                <button
                  onClick={createShop}
                  disabled={isProcessing || !token}
                  className="neu-button w-full mt-4"
                >
                  {isProcessing ? '⏳ Création...' : '🚀 Créer la boutique'}
                </button>
                <p className="text-xs text-gray-400 mt-2">
                  Le compte vendeur sera créé automatiquement dans Firebase.
                </p>
              </div>

              {/* Actions */}
              <div className="neu-card p-6 mb-6">
                <h2 className="text-xl font-semibold text-white mb-3">⚡ Actions</h2>
                <div className="flex flex-wrap gap-3">
                  <button
                    onClick={updateAllShops}
                    disabled={isProcessing || !token}
                    className="neu-button flex-1"
                  >
                    {isProcessing ? '⏳ Mise à jour...' : '🔄 Mettre à jour toutes les boutiques'}
                  </button>
                  <button
                    onClick={() => loadShops(token)}
                    disabled={isProcessing || !token}
                    className="neu-button"
                  >
                    🔍 Actualiser
                  </button>
                </div>
              </div>

              {/* Liste des boutiques */}
              <div className="neu-card p-6 mb-6">
                <h2 className="text-xl font-semibold text-white mb-3">📦 Boutiques existantes</h2>
                <div className="flex flex-wrap gap-2">
                  {shops.length === 0 ? (
                    <p className="text-gray-400">Aucune boutique trouvée</p>
                  ) : (
                    shops.map(shop => (
                      <div key={shop.name} className="bg-slate-800/40 px-3 py-2 rounded-lg flex items-center gap-2">
                        <span className="text-sm text-white">📁 {shop.name}</span>
                        <button
                          onClick={() => updateShop(shop.name)}
                          disabled={isProcessing || !token}
                          className="text-xs text-blue-400 hover:text-blue-300"
                        >
                          🔄
                        </button>
                        <a
                          href={`https://${TEMPLATE_OWNER}.github.io/${shop.name}/`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="text-xs text-emerald-400 hover:text-emerald-300"
                        >
                          🌐
                        </a>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ---- ONGLET ADMINISTRATION FIREBASE ---- */}
          {activeTab === 'admin' && (
            <div>
              {/* Connexion Firebase */}
              {!firebaseUser ? (
                <div className="neu-card p-6 mb-6">
                  <h2 className="text-xl font-semibold text-white mb-3">🔐 Connexion Firebase</h2>
                  <form onSubmit={handleFirebaseLogin} className="space-y-4">
                    <input
                      type="email"
                      name="email"
                      placeholder="Email"
                      className="neu-input"
                      required
                    />
                    <input
                      type="password"
                      name="password"
                      placeholder="Mot de passe"
                      className="neu-input"
                      required
                    />
                    <button type="submit" className="neu-button w-full" disabled={isProcessing}>
                      {isProcessing ? '⏳ Connexion...' : '🔑 Se connecter'}
                    </button>
                  </form>
                </div>
              ) : (
                <div>
                  {/* Info utilisateur */}
                  <div className="neu-card p-6 mb-6">
                    <div className="flex justify-between items-center">
                      <div>
                        <p className="text-white font-medium">👤 {firebaseUser.email}</p>
                        <p className="text-sm text-gray-400">
                          {isFirebaseAdmin ? '✅ Admin' : '❌ Pas admin'}
                        </p>
                      </div>
                      <button onClick={handleFirebaseLogout} className="neu-button">
                        🔓 Déconnexion
                      </button>
                    </div>
                  </div>

                  {/* Gestion des admins */}
                  {isFirebaseAdmin && (
                    <div>
                      <div className="neu-card p-6 mb-6">
                        <h3 className="text-lg font-semibold text-white mb-3">👑 Gestion des admins</h3>
                        <div className="flex gap-3 mb-4">
                          <input
                            type="email"
                            value={newAdminEmail}
                            onChange={(e) => setNewAdminEmail(e.target.value)}
                            placeholder="Email du nouvel admin"
                            className="neu-input flex-1"
                          />
                          <button
                            onClick={addAdmin}
                            disabled={isAddingAdmin}
                            className="neu-button"
                          >
                            {isAddingAdmin ? '⏳' : '✅ Ajouter'}
                          </button>
                        </div>
                        <div className="space-y-2">
                          {admins.map((admin, index) => (
                            <div key={index} className="flex justify-between items-center bg-slate-800/40 p-2 rounded-lg">
                              <span className="text-sm text-white">{admin.email || admin.uid}</span>
                              <button
                                onClick={() => removeAdmin(admin.uid)}
                                className="text-red-400 hover:text-red-300 text-sm"
                              >
                                ❌ Retirer
                              </button>
                            </div>
                          ))}
                          {admins.length === 0 && (
                            <p className="text-gray-400 text-sm">Aucun admin enregistré.</p>
                          )}
                        </div>
                      </div>

                      {/* Gestion des vendeurs */}
                      <div className="neu-card p-6">
                        <h3 className="text-lg font-semibold text-white mb-3">🏪 Gestion des vendeurs</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                          <input
                            type="text"
                            value={newVendorName}
                            onChange={(e) => setNewVendorName(e.target.value)}
                            placeholder="Nom du vendeur (ex: milo)"
                            className="neu-input"
                          />
                          <input
                            type="email"
                            value={newVendorEmail}
                            onChange={(e) => setNewVendorEmail(e.target.value)}
                            placeholder="Email du vendeur"
                            className="neu-input"
                          />
                        </div>
                        <button
                          onClick={addVendor}
                          disabled={isAddingVendor}
                          className="neu-button w-full mb-4"
                        >
                          {isAddingVendor ? '⏳ Ajout...' : '✅ Ajouter le vendeur'}
                        </button>
                        <div className="space-y-2">
                          {vendors.map((v) => (
                            <div key={v.name} className="flex justify-between items-center bg-slate-800/40 p-2 rounded-lg">
                              <div>
                                <span className="text-sm text-white font-medium">{v.name}</span>
                                <span className="text-xs text-gray-400 ml-2">{v.email}</span>
                              </div>
                              <button
                                onClick={() => removeVendor(v.name)}
                                className="text-red-400 hover:text-red-300 text-sm"
                              >
                                ❌ Retirer
                              </button>
                            </div>
                          ))}
                          {vendors.length === 0 && (
                            <p className="text-gray-400 text-sm">Aucun vendeur enregistré.</p>
                          )}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* ---- LOGS ---- */}
          <div className="neu-card p-6 mt-6">
            <h2 className="text-xl font-semibold text-white mb-3">📋 Logs</h2>
            <div className="log-area" ref={logRef}>
              {logs.length === 0 ? (
                <span className="text-gray-500">Aucun log disponible</span>
              ) : (
                logs.map((log, index) => (
                  <div key={index} className={log.type}>
                    <span className="text-gray-500">[{log.timestamp}]</span> {log.message}
                  </div>
                ))
              )}
            </div>
            <button
              onClick={() => setLogs([])}
              className="text-xs text-gray-500 hover:text-gray-300 mt-2"
            >
              🗑️ Effacer les logs
            </button>
          </div>

        </div>
      </div>
    );
  }

  const container = document.getElementById('root');
  const root = ReactDOM.createRoot(container);
  root.render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
</body>
</html>
