<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>SOG-Forkeur - Gestion des boutiques</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .neu-card {
      background: #1e293b;
      border-radius: 1.5rem;
      box-shadow: inset 2px 2px 4px rgba(255,255,255,0.05),
                  inset -2px -2px 4px rgba(0,0,0,0.8),
                  6px 6px 12px rgba(0,0,0,0.6);
    }
    .neu-button {
      background: #1e293b;
      color: white;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      box-shadow: inset 2px 2px 4px rgba(255,255,255,0.1),
                  inset -2px -2px 4px rgba(0,0,0,0.9),
                  4px 4px 8px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      font-weight: 500;
    }
    .neu-button:hover {
      box-shadow: inset -2px -2px 4px rgba(255,255,255,0.05),
                  inset 2px 2px 4px rgba(0,0,0,0.9);
      transform: scale(0.98);
    }
    .neu-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .neu-input {
      background: #1e293b;
      color: white;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.8),
                  inset -2px -2px 4px rgba(255,255,255,0.05);
      border: none;
      outline: none;
      width: 100%;
      transition: box-shadow 0.2s;
    }
    .neu-input:focus {
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.9),
                  inset -2px -2px 4px rgba(255,255,255,0.1),
                  0 0 0 2px #3b82f6;
    }
    .neu-input::placeholder {
      color: #94a3b8;
    }
    .log-area {
      background: #0f172a;
      border-radius: 0.75rem;
      padding: 1rem;
      max-height: 400px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      color: #94a3b8;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-area .success { color: #34d399; }
    .log-area .error { color: #f87171; }
    .log-area .info { color: #60a5fa; }
    .log-area .warning { color: #fbbf24; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
    .spinner {
      border: 3px solid #1e293b;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  function App() {

    // ---- ÉTATS ----
    const [token, setToken] = useState(null);
    const [isProcessing, setIsProcessing] = useState(false);
    const [logs, setLogs] = useState([]);
    const [shops, setShops] = useState([]);
    const [vendor, setVendor] = useState('');
    const [password, setPassword] = useState('');
    const [isLoading, setIsLoading] = useState(true);
    const logRef = useRef(null);

    // ---- CONSTANTES ----
    const TEMPLATE_OWNER = 'mekeirish';
    const TEMPLATE_REPO = 'hanout-template';

    // ---- INIT ----
    useEffect(() => {
      const storedToken = localStorage.getItem('forkeur_token');
      if (storedToken) {
        setToken(storedToken);
        loadShops(storedToken);
      }
      setIsLoading(false);
    }, []);

    // ---- SCROLL AUTO DES LOGS ----
    useEffect(() => {
      if (logRef.current) {
        logRef.current.scrollTop = logRef.current.scrollHeight;
      }
    }, [logs]);

    // ---- GESTION DU TOKEN ----
    const handleTokenChange = (e) => {
      const newToken = e.target.value;
      setToken(newToken);
      if (newToken) {
        localStorage.setItem('forkeur_token', newToken);
        loadShops(newToken);
      }
    };

    // ---- CHARGEMENT DES BOUTIQUES ----
    const loadShops = async (tokenValue) => {
      try {
        const res = await fetch('https://api.github.com/user/repos?per_page=100', {
          headers: { Authorization: `token ${tokenValue}` }
        });
        if (res.ok) {
          const repos = await res.json();
          const shopRepos = repos.filter(repo => 
            repo.name.startsWith('hanout-') && repo.name !== 'hanout-template'
          );
          setShops(shopRepos);
          addLog(`🔍 ${shopRepos.length} boutique(s) trouvée(s).`, 'info');
        } else {
          addLog(`❌ Erreur chargement des repos: ${res.status}`, 'error');
        }
      } catch (err) {
        addLog(`❌ Erreur: ${err.message}`, 'error');
      }
    };

    // ---- AJOUT DE LOG ----
    const addLog = (message, type = 'info') => {
      setLogs(prev => [...prev, { message, type, timestamp: new Date().toLocaleTimeString() }]);
    };

    // ---- SHA256 POUR LE MOT DE PASSE ----
    const sha256 = async (message) => {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    };

    // ---- VÉRIFIER LES PERMISSIONS DU TOKEN ----
    const checkTokenPermissions = async () => {
      try {
        const res = await fetch('https://api.github.com/user', {
          headers: { Authorization: `token ${token}` }
        });
        if (!res.ok) throw new Error('Token invalide');
        const user = await res.json();
        addLog(`✅ Token valide pour ${user.login}`, 'success');
        
        const scopes = res.headers.get('X-OAuth-Scopes');
        if (scopes) {
          addLog(`🔑 Scopes: ${scopes}`, 'info');
          if (!scopes.includes('repo') && !scopes.includes('public_repo')) {
            addLog('⚠️ Le token n\'a pas les permissions "repo" ou "public_repo".', 'warning');
          }
        }
        return true;
      } catch (err) {
        addLog(`❌ Erreur vérification token: ${err.message}`, 'error');
        return false;
      }
    };

    // ---- VÉRIFIER SI LE REPO EXISTE DÉJÀ ----
    const checkRepoExists = async (repoName) => {
      try {
        const res = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${repoName}`,
          { headers: { Authorization: `token ${token}` } }
        );
        return res.status === 200;
      } catch (e) {
        return false;
      }
    };

    // ---- CRÉER LE REPO À PARTIR DU TEMPLATE ----
    const createRepoFromTemplate = async (repoName) => {
      const res = await fetch(`https://api.github.com/repos/${TEMPLATE_OWNER}/${TEMPLATE_REPO}/generate`, {
        method: 'POST',
        headers: {
          Authorization: `token ${token}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify({
          name: repoName,
          owner: TEMPLATE_OWNER,
          private: false,
          include_all_branches: false
        })
      });
      
      if (!res.ok) {
        const err = await res.json();
        if (err.message && err.message.includes('already exists')) {
          addLog(`⚠️ Le repo ${repoName} existe déjà`, 'warning');
          return null;
        }
        throw new Error(`Création échouée: ${err.message}`);
      }
      return await res.json();
    };

    // ---- ACTIVER GITHUB PAGES ----
    const enableGitHubPages = async (repoName) => {
      try {
        addLog(`🌐 Activation de GitHub Pages pour ${repoName}...`, 'info');
        const res = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${repoName}/pages`,
          {
            method: 'POST',
            headers: {
              Authorization: `token ${token}`,
              'Content-Type': 'application/json',
              'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify({
              source: { branch: 'main', path: '/' }
            })
          }
        );
        if (res.status === 201 || res.status === 200) {
          addLog(`✅ GitHub Pages activé pour ${repoName}`, 'success');
          return true;
        } else if (res.status === 409) {
          addLog(`ℹ️ GitHub Pages déjà activé pour ${repoName}`, 'info');
          return true;
        } else {
          const err = await res.json();
          addLog(`⚠️ Erreur activation Pages: ${err.message}`, 'warning');
          return false;
        }
      } catch (error) {
        addLog(`⚠️ Erreur activation Pages: ${error.message}`, 'warning');
        return false;
      }
    };

    // ---- ATTENDRE QUE GITHUB PAGES SOIT PRÊT (NOUVEAU) ----
    const waitForPagesDeployment = async (repoName, maxAttempts = 25) => {
      let attempts = 0;
      const pagesApiUrl = `https://api.github.com/repos/${TEMPLATE_OWNER}/${repoName}/pages`;
      const siteUrl = `https://${TEMPLATE_OWNER}.github.io/${repoName}/`;

      addLog(`⏳ Vérification du déploiement Pages pour ${repoName}...`, 'warning');

      while (attempts < maxAttempts) {
        try {
          // 1. Vérifier le statut via l'API Pages
          const res = await fetch(pagesApiUrl, {
            headers: { Authorization: `token ${token}` }
          });

          if (res.ok) {
            const data = await res.json();
            if (data.status === 'building' || data.status === 'pending') {
              addLog(`⏳ Déploiement en cours... (${attempts + 1}/${maxAttempts})`, 'warning');
              await new Promise(resolve => setTimeout(resolve, 3000));
              attempts++;
              continue;
            }
          }

          // 2. Vérifier si le site est accessible
          const siteCheck = await fetch(siteUrl, { method: 'HEAD' });
          if (siteCheck.status === 200) {
            addLog(`✅ Site accessible : ${siteUrl}`, 'success');
            return true;
          }

          // 3. Si le site n'est pas encore prêt
          addLog(`⏳ Site pas encore accessible... (${attempts + 1}/${maxAttempts})`, 'warning');
          await new Promise(resolve => setTimeout(resolve, 3000));
          attempts++;

        } catch (err) {
          addLog(`⚠️ Erreur vérification: ${err.message}`, 'warning');
          await new Promise(resolve => setTimeout(resolve, 3000));
          attempts++;
        }
      }

      addLog(`⚠️ Déploiement Pages non confirmé après ${maxAttempts} tentatives.`, 'warning');
      return false;
    };

    // ---- RÉCUPÉRER LE CONTENU D'UN FICHIER ----
    const getFileContent = async (repoName, filePath) => {
      try {
        const res = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${repoName}/contents/${filePath}`,
          { headers: { Authorization: `token ${token}` } }
        );
        if (!res.ok) {
          throw new Error(`Erreur ${res.status}: ${await res.text()}`);
        }
        return await res.json();
      } catch (err) {
        throw new Error(`Impossible de récupérer ${filePath}: ${err.message}`);
      }
    };

    // ---- METTRE À JOUR UN FICHIER ----
    const updateFile = async (repoName, filePath, content, message) => {
      try {
        let sha = null;
        try {
          const fileData = await getFileContent(repoName, filePath);
          sha = fileData.sha;
        } catch (e) {}

        const payload = {
          message: message,
          content: btoa(unescape(encodeURIComponent(content))),
          branch: 'main'
        };
        if (sha) payload.sha = sha;

        const res = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${repoName}/contents/${filePath}`,
          {
            method: 'PUT',
            headers: {
              Authorization: `token ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          }
        );

        if (!res.ok) {
          const err = await res.json();
          throw new Error(`Erreur ${res.status}: ${err.message}`);
        }
        return await res.json();
      } catch (err) {
        throw new Error(`Impossible de mettre à jour ${filePath}: ${err.message}`);
      }
    };

    // ---- MISE À JOUR DE SHOPS.JSON ----
    const updateShopsJson = async (vendorName) => {
      try {
        addLog(`📝 Vérification de ${vendorName} dans shops.json...`, 'info');
        const shopsUrl = 'https://api.github.com/repos/mekeirish/sog/contents/shops.json';
        let shops = [];
        let sha = null;

        try {
          const getRes = await fetch(shopsUrl, {
            headers: { Authorization: `token ${token}` }
          });
          if (getRes.ok) {
            const data = await getRes.json();
            sha = data.sha;
            const decoded = atob(data.content);
            shops = JSON.parse(decoded);
            addLog(`📄 shops.json chargé (${shops.length} boutiques)`, 'info');
          } else if (getRes.status === 404) {
            addLog('📄 shops.json n\'existe pas, création...', 'warning');
            shops = [];
          } else {
            throw new Error(`Erreur ${getRes.status}`);
          }
        } catch (e) {
          shops = [];
        }

        const existing = shops.find(s => s.vendor === vendorName);
        if (existing) {
          addLog(`ℹ️ ${vendorName} déjà présent dans shops.json`, 'info');
          return true;
        }

        shops.push({
          vendor: vendorName,
          name: vendorName.charAt(0).toUpperCase() + vendorName.slice(1),
          url: `https://${TEMPLATE_OWNER}.github.io/hanout-${vendorName}/`
        });

        const content = btoa(unescape(encodeURIComponent(JSON.stringify(shops, null, 2))));
        const payload = {
          message: `✨ Ajout automatique de ${vendorName}`,
          content: content,
          branch: 'main'
        };
        if (sha) payload.sha = sha;

        const putRes = await fetch(shopsUrl, {
          method: 'PUT',
          headers: {
            Authorization: `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!putRes.ok) {
          const err = await putRes.json();
          throw new Error(`GitHub ${putRes.status}: ${err.message}`);
        }

        addLog(`✅ ${vendorName} ajouté dans shops.json`, 'success');
        return true;

      } catch (error) {
        addLog(`❌ Erreur mise à jour shops.json: ${error.message}`, 'error');
        return false;
      }
    };

    // ---- CRÉATION D'UNE BOUTIQUE (AMÉLIORÉE) ----
    const createShop = async () => {
      if (!vendor.trim()) {
        addLog('❌ Veuillez entrer un nom de vendeur', 'error');
        return;
      }
      if (!password.trim()) {
        addLog('❌ Veuillez entrer un mot de passe admin', 'error');
        return;
      }
      if (!token) {
        addLog('❌ Token GitHub requis', 'error');
        return;
      }

      setIsProcessing(true);
      const cleanVendor = vendor.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
      const repoName = `hanout-${cleanVendor}`;

      try {
        const hasPermissions = await checkTokenPermissions();
        if (!hasPermissions) {
          addLog('❌ Le token n\'a pas les permissions nécessaires', 'error');
          setIsProcessing(false);
          return;
        }

        addLog(`🔍 Vérification si ${repoName} existe...`, 'info');
        const exists = await checkRepoExists(repoName);
        if (exists) {
          addLog(`⚠️ ${repoName} existe déjà !`, 'warning');
          setIsProcessing(false);
          return;
        }

        addLog(`🚀 Création de ${repoName} à partir du template...`, 'info');
        const repoData = await createRepoFromTemplate(repoName);
        if (!repoData) {
          setIsProcessing(false);
          return;
        }

        addLog(`✅ Repo ${repoName} créé avec succès !`, 'success');

        // Attendre un peu que le repo soit accessible
        addLog(`⏳ Attente que le repo soit disponible...`, 'warning');
        await new Promise(resolve => setTimeout(resolve, 3000));

        // Récupérer le template
        addLog(`📄 Récupération du template...`, 'info');
        const templateData = await getFileContent(TEMPLATE_REPO, 'index.html');
        let templateContent = atob(templateData.content);

        const passwordHash = await sha256(password);
        addLog(`🔐 Hash du mot de passe généré`, 'info');

        let newContent = templateContent.replace(/{{VENDOR}}/g, cleanVendor);
        newContent = newContent.replace(/{{PASSWORD_HASH}}/g, passwordHash);

        addLog(`💾 Sauvegarde de index.html...`, 'info');
        await updateFile(repoName, 'index.html', newContent, `Initialisation de ${repoName}`);
        addLog(`✅ index.html mis à jour`, 'success');

        addLog(`📦 Création de don.json...`, 'info');
        const defaultData = {
          settings: {
            title: `Boutique de ${cleanVendor}`,
            currency: 'DZD',
            showStock: true,
            ntfyTopic: `${cleanVendor}_commandes`
          },
          categories: [],
          products: []
        };
        await updateFile(
          repoName,
          'don.json',
          JSON.stringify(defaultData, null, 2),
          `Ajout du catalogue ${cleanVendor}`
        );
        addLog(`✅ don.json créé`, 'success');

        // Activer GitHub Pages
        await enableGitHubPages(repoName);

        // ---- ATTENDRE QUE LE DÉPLOIEMENT SOIT PRÊT (NOUVEAU) ----
        const pagesReady = await waitForPagesDeployment(repoName);
        if (pagesReady) {
          addLog(`✅ GitHub Pages prêt pour ${repoName}`, 'success');
        } else {
          addLog(`⚠️ GitHub Pages pas encore prêt, mais le repo est créé. Vérifie dans 2 minutes.`, 'warning');
        }

        // Mettre à jour shops.json
        await updateShopsJson(cleanVendor);

        // Rafraîchir la liste
        await loadShops(token);
        setVendor('');
        setPassword('');

        const pagesUrl = `https://${TEMPLATE_OWNER}.github.io/${repoName}/`;
        addLog(`🎉 Boutique ${repoName} créée avec succès !`, 'success');
        addLog(`🌐 Disponible sur : ${pagesUrl}`, 'success');

      } catch (error) {
        addLog(`❌ Erreur: ${error.message}`, 'error');
      }

      setIsProcessing(false);
    };

    // ---- MISE À JOUR D'UNE BOUTIQUE ----
    const updateShop = async (repoName) => {
      if (!token) {
        addLog('❌ Token requis', 'error');
        return;
      }

      setIsProcessing(true);
      const vendorName = repoName.replace('hanout-', '');

      try {
        addLog(`🔄 Mise à jour de ${repoName}...`, 'info');

        const templateRes = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${TEMPLATE_REPO}/contents/index.html`,
          { headers: { Authorization: `token ${token}` } }
        );

        if (!templateRes.ok) {
          throw new Error('Impossible de récupérer le template');
        }

        const templateData = await templateRes.json();
        let templateContent = atob(templateData.content);

        const shopRes = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${repoName}/contents/index.html`,
          { headers: { Authorization: `token ${token}` } }
        );

        if (!shopRes.ok) {
          throw new Error(`Impossible de récupérer ${repoName}`);
        }

        const shopData = await shopRes.json();
        const currentContent = atob(shopData.content);
        const vendorMatch = currentContent.match(/var VENDOR = "([^"]+)";/);
        const passMatch = currentContent.match(/var PASSWORD_HASH = "([^"]+)";/);

        const currentVendor = vendorMatch ? vendorMatch[1] : vendorName;
        const currentPass = passMatch ? passMatch[1] : '';

        let newContent = templateContent.replace(/{{VENDOR}}/g, currentVendor);
        newContent = newContent.replace(/{{PASSWORD_HASH}}/g, currentPass);

        await updateFile(repoName, 'index.html', newContent, `Mise à jour de ${repoName}`);
        addLog(`✅ ${repoName} mis à jour.`, 'success');

        await updateShopsJson(currentVendor);

      } catch (error) {
        addLog(`❌ Erreur ${repoName}: ${error.message}`, 'error');
      }

      setIsProcessing(false);
    };

    // ---- MISE À JOUR MASSIVE ----
    const updateAllShops = async () => {
      if (!token) {
        addLog('❌ Token requis', 'error');
        return;
      }

      setIsProcessing(true);

      try {
        const repos = await fetch('https://api.github.com/user/repos?per_page=100', {
          headers: { Authorization: `token ${token}` }
        });

        if (!repos.ok) {
          throw new Error('Impossible de récupérer les repos');
        }

        const repoList = await repos.json();
        const shopRepos = repoList.filter(repo => 
          repo.name.startsWith('hanout-') && repo.name !== 'hanout-template'
        );

        addLog(`📦 ${shopRepos.length} boutique(s) trouvée(s).`, 'info');

        let successCount = 0;
        for (const repo of shopRepos) {
          await updateShop(repo.name);
          successCount++;
        }

        addLog(`✅ ${successCount} boutique(s) mises à jour.`, 'success');

      } catch (error) {
        addLog(`❌ Erreur lors de la mise à jour massive: ${error.message}`, 'error');
      }

      setIsProcessing(false);
    };

    // ---- RENDU ----
    if (isLoading) {
      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-900">
          <div className="spinner"></div>
        </div>
      );
    }

    return (
      <div className="min-h-screen bg-slate-900 text-white p-4">

        <div className="max-w-4xl mx-auto">
          <h1 className="text-3xl font-bold text-white mb-6 text-center">🔧 SOG-Forkeur</h1>

          <div className="neu-card p-6 mb-6">
            <h2 className="text-xl font-semibold text-white mb-3">🔑 Token GitHub</h2>
            <input
              type="password"
              value={token || ''}
              onChange={handleTokenChange}
              placeholder="Entrez votre token GitHub (fine-grained)"
              className="neu-input"
            />
            <p className="text-xs text-gray-400 mt-2">
              Le token est stocké localement dans votre navigateur.
            </p>
          </div>

          <div className="neu-card p-6 mb-6">
            <h2 className="text-xl font-semibold text-white mb-3">✨ Créer une boutique</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="text-sm text-gray-400 block mb-1">Nom du vendeur</label>
                <input
                  type="text"
                  value={vendor}
                  onChange={(e) => setVendor(e.target.value)}
                  placeholder="ex: gomaziz"
                  className="neu-input"
                  disabled={isProcessing}
                />
              </div>
              <div>
                <label className="text-sm text-gray-400 block mb-1">Mot de passe admin</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="Mot de passe pour l'admin"
                  className="neu-input"
                  disabled={isProcessing}
                />
              </div>
            </div>
            <button
              onClick={createShop}
              disabled={isProcessing || !token}
              className="neu-button w-full mt-4"
            >
              {isProcessing ? '⏳ Création...' : '🚀 Créer la boutique'}
            </button>
          </div>

          <div className="neu-card p-6 mb-6">
            <h2 className="text-xl font-semibold text-white mb-3">⚡ Actions</h2>
            <div className="flex flex-wrap gap-3">
              <button
                onClick={updateAllShops}
                disabled={isProcessing || !token}
                className="neu-button flex-1"
              >
                {isProcessing ? '⏳ Mise à jour...' : '🔄 Mettre à jour toutes les boutiques'}
              </button>
              <button
                onClick={() => loadShops(token)}
                disabled={isProcessing || !token}
                className="neu-button"
              >
                🔍 Actualiser
              </button>
            </div>
          </div>

          <div className="neu-card p-6 mb-6">
            <h2 className="text-xl font-semibold text-white mb-3">📦 Boutiques existantes</h2>
            <div className="flex flex-wrap gap-2">
              {shops.length === 0 ? (
                <p className="text-gray-400">Aucune boutique trouvée</p>
              ) : (
                shops.map(shop => (
                  <div key={shop.name} className="bg-slate-800/40 px-3 py-2 rounded-lg flex items-center gap-2">
                    <span className="text-sm text-white">📁 {shop.name}</span>
                    <button
                      onClick={() => updateShop(shop.name)}
                      disabled={isProcessing || !token}
                      className="text-xs text-blue-400 hover:text-blue-300"
                    >
                      🔄
                    </button>
                    <a
                      href={`https://${TEMPLATE_OWNER}.github.io/${shop.name}/`}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="text-xs text-emerald-400 hover:text-emerald-300"
                    >
                      🌐
                    </a>
                  </div>
                ))
              )}
            </div>
          </div>

          <div className="neu-card p-6">
            <h2 className="text-xl font-semibold text-white mb-3">📋 Logs</h2>
            <div className="log-area" ref={logRef}>
              {logs.length === 0 ? (
                <span className="text-gray-500">Aucun log disponible</span>
              ) : (
                logs.map((log, index) => (
                  <div key={index} className={log.type}>
                    <span className="text-gray-500">[{log.timestamp}]</span> {log.message}
                  </div>
                ))
              )}
            </div>
            <button
              onClick={() => setLogs([])}
              className="text-xs text-gray-500 hover:text-gray-300 mt-2"
            >
              🗑️ Effacer les logs
            </button>
          </div>

        </div>
      </div>
    );
  }

  const container = document.getElementById('root');
  const root = ReactDOM.createRoot(container);
  root.render(<App />);
</script>
</body>
</html>
