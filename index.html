<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>SOG-Forkeur - Gestion des boutiques</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .neu-card {
      background: #1e293b;
      border-radius: 1.5rem;
      box-shadow: inset 2px 2px 4px rgba(255,255,255,0.05),
                  inset -2px -2px 4px rgba(0,0,0,0.8),
                  6px 6px 12px rgba(0,0,0,0.6);
    }
    .neu-button {
      background: #1e293b;
      color: white;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      box-shadow: inset 2px 2px 4px rgba(255,255,255,0.1),
                  inset -2px -2px 4px rgba(0,0,0,0.9),
                  4px 4px 8px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      font-weight: 500;
    }
    .neu-button:hover {
      box-shadow: inset -2px -2px 4px rgba(255,255,255,0.05),
                  inset 2px 2px 4px rgba(0,0,0,0.9);
      transform: scale(0.98);
    }
    .neu-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .neu-input {
      background: #1e293b;
      color: white;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.8),
                  inset -2px -2px 4px rgba(255,255,255,0.05);
      border: none;
      outline: none;
      width: 100%;
      transition: box-shadow 0.2s;
    }
    .neu-input:focus {
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.9),
                  inset -2px -2px 4px rgba(255,255,255,0.1),
                  0 0 0 2px #3b82f6;
    }
    .neu-input::placeholder {
      color: #94a3b8;
    }
    .log-area {
      background: #0f172a;
      border-radius: 0.75rem;
      padding: 1rem;
      max-height: 400px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      color: #94a3b8;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-area .success { color: #34d399; }
    .log-area .error { color: #f87171; }
    .log-area .info { color: #60a5fa; }
    .log-area .warning { color: #fbbf24; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
    .spinner {
      border: 3px solid #1e293b;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef, useMemo } = React;

  function App() {

    // ---- ÉTATS ----
    const [token, setToken] = useState(null);
    const [isProcessing, setIsProcessing] = useState(false);
    const [logs, setLogs] = useState([]);
    const [shops, setShops] = useState([]);
    const [vendor, setVendor] = useState('');
    const [password, setPassword] = useState('');
    const [isLoading, setIsLoading] = useState(true);
    const [repoName, setRepoName] = useState('');
    const logRef = useRef(null);

    // ---- CONSTANTES ----
    const TEMPLATE_OWNER = 'mekeirish';
    const TEMPLATE_REPO = 'hanout-template';

    // ---- INIT ----
    useEffect(() => {
      const storedToken = localStorage.getItem('forkeur_token');
      if (storedToken) {
        setToken(storedToken);
        loadShops(storedToken);
      }
      setIsLoading(false);
    }, []);

    // ---- SCROLL AUTO DES LOGS ----
    useEffect(() => {
      if (logRef.current) {
        logRef.current.scrollTop = logRef.current.scrollHeight;
      }
    }, [logs]);

    // ---- GESTION DU TOKEN ----
    const handleTokenChange = (e) => {
      const newToken = e.target.value;
      setToken(newToken);
      if (newToken) {
        localStorage.setItem('forkeur_token', newToken);
        loadShops(newToken);
      }
    };

    // ---- CHARGEMENT DES BOUTIQUES ----
    const loadShops = async (tokenValue) => {
      try {
        const res = await fetch('https://api.github.com/user/repos?per_page=100', {
          headers: { Authorization: `token ${tokenValue}` }
        });
        if (res.ok) {
          const repos = await res.json();
          const shopRepos = repos.filter(repo => 
            repo.name.startsWith('hanout-') && repo.name !== 'hanout-template'
          );
          setShops(shopRepos);
          addLog(`🔍 ${shopRepos.length} boutique(s) trouvée(s).`, 'info');
        } else {
          addLog(`❌ Erreur chargement des repos: ${res.status}`, 'error');
        }
      } catch (err) {
        addLog(`❌ Erreur: ${err.message}`, 'error');
      }
    };

    // ---- AJOUT DE LOG ----
    const addLog = (message, type = 'info') => {
      setLogs(prev => [...prev, { message, type, timestamp: new Date().toLocaleTimeString() }]);
    };

    // ---- SHA256 POUR LE MOT DE PASSE ----
    const sha256 = async (message) => {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    };

    // ---- MISE À JOUR DE SHOPS.JSON (AUTOMATIQUE) ----
    const updateShopsJson = async (vendorName) => {
      try {
        addLog(`📝 Vérification de ${vendorName} dans shops.json...`, 'info');
        
        if (!token) {
          addLog('❌ Token requis pour mettre à jour shops.json', 'error');
          return false;
        }
        
        const shopsUrl = 'https://api.github.com/repos/mekeirish/sog/contents/shops.json';
        let shops = [];
        let sha = null;
        
        try {
          const getRes = await fetch(shopsUrl, {
            headers: { Authorization: `token ${token}` }
          });
          
          if (getRes.ok) {
            const data = await getRes.json();
            sha = data.sha;
            const decoded = atob(data.content);
            shops = JSON.parse(decoded);
            addLog(`📄 shops.json chargé (${shops.length} boutiques)`, 'info');
          } else if (getRes.status === 404) {
            addLog('📄 shops.json n\'existe pas, création...', 'warning');
            shops = [];
          } else {
            throw new Error(`Erreur ${getRes.status}`);
          }
        } catch (e) {
          addLog('📄 Création d\'un nouveau shops.json', 'warning');
          shops = [];
        }
        
        // Vérifier si le vendeur existe déjà
        const existing = shops.find(s => s.vendor === vendorName);
        if (existing) {
          addLog(`ℹ️ ${vendorName} déjà présent dans shops.json`, 'info');
          return true;
        }
        
        // Ajouter la nouvelle boutique
        const newShop = {
          vendor: vendorName,
          name: vendorName.charAt(0).toUpperCase() + vendorName.slice(1),
          url: `https://${TEMPLATE_OWNER}.github.io/hanout-${vendorName}/`
        };
        shops.push(newShop);
        addLog(`➕ Ajout de ${vendorName} (${shops.length} boutique${shops.length > 1 ? 's' : ''} au total)`, 'info');
        
        // Encoder et sauvegarder
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(shops, null, 2))));
        const payload = {
          message: `✨ Ajout automatique de ${vendorName}`,
          content: content,
          branch: 'main'
        };
        if (sha) payload.sha = sha;
        
        const putRes = await fetch(shopsUrl, {
          method: 'PUT',
          headers: {
            Authorization: `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        
        if (!putRes.ok) {
          const err = await putRes.json();
          throw new Error(`GitHub ${putRes.status}: ${err.message}`);
        }
        
        addLog(`✅ ${vendorName} ajouté dans shops.json`, 'success');
        return true;
        
      } catch (error) {
        addLog(`❌ Erreur mise à jour shops.json: ${error.message}`, 'error');
        return false;
      }
    };

    // ---- CRÉATION D'UNE BOUTIQUE ----
    const createShop = async () => {
      if (!vendor.trim()) {
        addLog('❌ Veuillez entrer un nom de vendeur', 'error');
        return;
      }
      if (!password.trim()) {
        addLog('❌ Veuillez entrer un mot de passe admin', 'error');
        return;
      }
      if (!token) {
        addLog('❌ Token GitHub requis', 'error');
        return;
      }

      setIsProcessing(true);
      const cleanVendor = vendor.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
      
      try {
        addLog(`🚀 Création de hanout-${cleanVendor}...`, 'info');
        
        // 1. Forker le template
        const forkRes = await fetch(`https://api.github.com/repos/${TEMPLATE_OWNER}/${TEMPLATE_REPO}/forks`, {
          method: 'POST',
          headers: {
            Authorization: `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name: `hanout-${cleanVendor}` })
        });

        if (!forkRes.ok) {
          const err = await forkRes.json();
          throw new Error(`Fork échoué: ${err.message}`);
        }

        addLog(`✅ Fork créé: hanout-${cleanVendor}`, 'success');

        // 2. Récupérer le SHA du fichier index.html
        const shaRes = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/hanout-${cleanVendor}/contents/index.html`,
          { headers: { Authorization: `token ${token}` } }
        );

        if (!shaRes.ok) {
          throw new Error('Impossible de récupérer index.html');
        }

        const shaData = await shaRes.json();
        const fileSha = shaData.sha;

        // 3. Générer le hash du mot de passe
        const passwordHash = await sha256(password);
        addLog(`🔐 Hash du mot de passe généré`, 'info');

        // 4. Lire le contenu actuel
        const content = atob(shaData.content);
        
        // 5. Remplacer les variables
        let newContent = content.replace(/{{VENDOR}}/g, cleanVendor);
        newContent = newContent.replace(/{{PASSWORD_HASH}}/g, passwordHash);

        // 6. Sauvegarder le fichier modifié
        const updateRes = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/hanout-${cleanVendor}/contents/index.html`,
          {
            method: 'PUT',
            headers: {
              Authorization: `token ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `Initialisation de hanout-${cleanVendor}`,
              content: btoa(unescape(encodeURIComponent(newContent))),
              sha: fileSha,
              branch: 'main'
            })
          }
        );

        if (!updateRes.ok) {
          const err = await updateRes.json();
          throw new Error(`Échec mise à jour: ${err.message}`);
        }

        addLog(`✅ hanout-${cleanVendor} initialisé avec succès`, 'success');

        // 7. Créer un don.json par défaut
        const defaultData = {
          settings: {
            title: `Boutique de ${cleanVendor}`,
            currency: 'DZD',
            showStock: true,
            ntfyTopic: `${cleanVendor}_commandes`
          },
          categories: [],
          products: []
        };

        const donRes = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/hanout-${cleanVendor}/contents/don.json`,
          {
            method: 'PUT',
            headers: {
              Authorization: `token ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `Ajout du catalogue ${cleanVendor}`,
              content: btoa(unescape(encodeURIComponent(JSON.stringify(defaultData, null, 2)))),
              branch: 'main'
            })
          }
        );

        if (!donRes.ok) {
          const err = await donRes.json();
          addLog(`⚠️ Erreur création don.json: ${err.message}`, 'warning');
        } else {
          addLog(`✅ don.json créé pour ${cleanVendor}`, 'success');
        }

        // 8. Mettre à jour shops.json (AUTOMATIQUE)
        await updateShopsJson(cleanVendor);

        // 9. Rafraîchir la liste
        loadShops(token);
        setVendor('');
        setPassword('');
        addLog(`🎉 Boutique hanout-${cleanVendor} créée avec succès !`, 'success');

      } catch (error) {
        addLog(`❌ Erreur: ${error.message}`, 'error');
      }

      setIsProcessing(false);
    };

    // ---- MISE À JOUR D'UNE BOUTIQUE ----
    const updateShop = async (repoName) => {
      if (!token) {
        addLog('❌ Token requis', 'error');
        return;
      }

      setIsProcessing(true);
      const vendorName = repoName.replace('hanout-', '');
      
      try {
        addLog(`🔄 Mise à jour de ${repoName}...`, 'info');

        // 1. Récupérer le template
        const templateRes = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${TEMPLATE_REPO}/contents/index.html`,
          { headers: { Authorization: `token ${token}` } }
        );

        if (!templateRes.ok) {
          throw new Error('Impossible de récupérer le template');
        }

        const templateData = await templateRes.json();
        const templateContent = atob(templateData.content);

        // 2. Récupérer le fichier actuel de la boutique pour avoir le SHA
        const shopRes = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${repoName}/contents/index.html`,
          { headers: { Authorization: `token ${token}` } }
        );

        if (!shopRes.ok) {
          throw new Error(`Impossible de récupérer ${repoName}`);
        }

        const shopData = await shopRes.json();
        const shopSha = shopData.sha;

        // 3. Récupérer les variables actuelles (VENDOR et PASSWORD_HASH)
        const currentContent = atob(shopData.content);
        const vendorMatch = currentContent.match(/var VENDOR = "([^"]+)";/);
        const passMatch = currentContent.match(/var PASSWORD_HASH = "([^"]+)";/);
        
        const currentVendor = vendorMatch ? vendorMatch[1] : vendorName;
        const currentPass = passMatch ? passMatch[1] : '';

        // 4. Remplacer les variables dans le nouveau template
        let newContent = templateContent.replace(/{{VENDOR}}/g, currentVendor);
        newContent = newContent.replace(/{{PASSWORD_HASH}}/g, currentPass);

        // 5. Sauvegarder
        const updateRes = await fetch(
          `https://api.github.com/repos/${TEMPLATE_OWNER}/${repoName}/contents/index.html`,
          {
            method: 'PUT',
            headers: {
              Authorization: `token ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `Mise à jour de ${repoName}`,
              content: btoa(unescape(encodeURIComponent(newContent))),
              sha: shopSha,
              branch: 'main'
            })
          }
        );

        if (!updateRes.ok) {
          const err = await updateRes.json();
          throw new Error(`Échec mise à jour: ${err.message}`);
        }

        addLog(`✅ ${repoName} mis à jour.`, 'success');

        // 6. Vérifier/mettre à jour shops.json (AUTOMATIQUE)
        await updateShopsJson(currentVendor);

      } catch (error) {
        addLog(`❌ Erreur ${repoName}: ${error.message}`, 'error');
      }

      setIsProcessing(false);
    };

    // ---- MISE À JOUR MASSIVE ----
    const updateAllShops = async () => {
      if (!token) {
        addLog('❌ Token requis', 'error');
        return;
      }

      setIsProcessing(true);
      let successCount = 0;
      let errorCount = 0;

      try {
        const repos = await fetch('https://api.github.com/user/repos?per_page=100', {
          headers: { Authorization: `token ${token}` }
        });
        
        if (!repos.ok) {
          throw new Error('Impossible de récupérer les repos');
        }

        const repoList = await repos.json();
        const shopRepos = repoList.filter(repo => 
          repo.name.startsWith('hanout-') && repo.name !== 'hanout-template'
        );

        addLog(`📦 ${shopRepos.length} boutique(s) trouvée(s).`, 'info');

        for (const repo of shopRepos) {
          // On attend que chaque mise à jour soit terminée
          await updateShop(repo.name);
          // On vérifie si la mise à jour a été un succès ou une erreur
          // (on compte approximativement)
          const lastLog = logs[logs.length - 1];
          if (lastLog && lastLog.type === 'success' && lastLog.message.includes(repo.name)) {
            successCount++;
          } else {
            errorCount++;
          }
        }

        addLog(`✅ ${successCount} boutique(s) mises à jour. ⚠️ ${errorCount} erreur(s).`, 'success');

      } catch (error) {
        addLog(`❌ Erreur lors de la mise à jour massive: ${error.message}`, 'error');
      }

      setIsProcessing(false);
    };

    // ---- RENDU ----
    if (isLoading) {
      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-900">
          <div className="spinner"></div>
        </div>
      );
    }

    return (
      <div className="min-h-screen bg-slate-900 text-white p-4">

        <div className="max-w-4xl mx-auto">
          <h1 className="text-3xl font-bold text-white mb-6 text-center">🔧 SOG-Forkeur</h1>

          {/* Token GitHub */}
          <div className="neu-card p-6 mb-6">
            <h2 className="text-xl font-semibold text-white mb-3">🔑 Token GitHub</h2>
            <input
              type="password"
              value={token || ''}
              onChange={handleTokenChange}
              placeholder="Entrez votre token GitHub (fine-grained)"
              className="neu-input"
            />
            <p className="text-xs text-gray-400 mt-2">
              Le token est stocké localement dans votre navigateur.
            </p>
          </div>

          {/* Création d'une boutique */}
          <div className="neu-card p-6 mb-6">
            <h2 className="text-xl font-semibold text-white mb-3">✨ Créer une boutique</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="text-sm text-gray-400 block mb-1">Nom du vendeur</label>
                <input
                  type="text"
                  value={vendor}
                  onChange={(e) => setVendor(e.target.value)}
                  placeholder="ex: gomaziz"
                  className="neu-input"
                  disabled={isProcessing}
                />
              </div>
              <div>
                <label className="text-sm text-gray-400 block mb-1">Mot de passe admin</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="Mot de passe pour l'admin"
                  className="neu-input"
                  disabled={isProcessing}
                />
              </div>
            </div>
            <button
              onClick={createShop}
              disabled={isProcessing || !token}
              className="neu-button w-full mt-4"
            >
              {isProcessing ? '⏳ Création...' : '🚀 Créer la boutique'}
            </button>
          </div>

          {/* Actions */}
          <div className="neu-card p-6 mb-6">
            <h2 className="text-xl font-semibold text-white mb-3">⚡ Actions</h2>
            <div className="flex flex-wrap gap-3">
              <button
                onClick={updateAllShops}
                disabled={isProcessing || !token}
                className="neu-button flex-1"
              >
                {isProcessing ? '⏳ Mise à jour...' : '🔄 Mettre à jour toutes les boutiques'}
              </button>
              <button
                onClick={() => loadShops(token)}
                disabled={isProcessing || !token}
                className="neu-button"
              >
                🔍 Actualiser
              </button>
            </div>
          </div>

          {/* Liste des boutiques */}
          <div className="neu-card p-6 mb-6">
            <h2 className="text-xl font-semibold text-white mb-3">📦 Boutiques existantes</h2>
            <div className="flex flex-wrap gap-2">
              {shops.length === 0 ? (
                <p className="text-gray-400">Aucune boutique trouvée</p>
              ) : (
                shops.map(shop => (
                  <div key={shop.name} className="bg-slate-800/40 px-3 py-2 rounded-lg flex items-center gap-2">
                    <span className="text-sm text-white">📁 {shop.name}</span>
                    <button
                      onClick={() => updateShop(shop.name)}
                      disabled={isProcessing || !token}
                      className="text-xs text-blue-400 hover:text-blue-300"
                    >
                      🔄
                    </button>
                    <a
                      href={`https://${TEMPLATE_OWNER}.github.io/${shop.name}/`}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="text-xs text-emerald-400 hover:text-emerald-300"
                    >
                      🌐
                    </a>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* Logs */}
          <div className="neu-card p-6">
            <h2 className="text-xl font-semibold text-white mb-3">📋 Logs</h2>
            <div className="log-area" ref={logRef}>
              {logs.length === 0 ? (
                <span className="text-gray-500">Aucun log disponible</span>
              ) : (
                logs.map((log, index) => (
                  <div key={index} className={log.type}>
                    <span className="text-gray-500">[{log.timestamp}]</span> {log.message}
                  </div>
                ))
              )}
            </div>
            <button
              onClick={() => setLogs([])}
              className="text-xs text-gray-500 hover:text-gray-300 mt-2"
            >
              🗑️ Effacer les logs
            </button>
          </div>

        </div>
      </div>
    );
  }

  const container = document.getElementById('root');
  const root = ReactDOM.createRoot(container);
  root.render(<App />);
</script>
</body>
</html>
